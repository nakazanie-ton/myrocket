name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/xrocket-exchange
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/xrocket-exchange/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundled server
        run: |
          npm run build
          git diff --exit-code -- dist/cli.js

      - name: Smoke-test bundled stdio server
        run: npm run smoke:stdio

      - name: Build and smoke-test container
        working-directory: .
        run: |
          docker build --tag xrocket-mcp:ci .
          cd plugins/xrocket-exchange
          XROCKET_SMOKE_DOCKER_IMAGE=xrocket-mcp:ci npm run smoke:stdio

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Parse JSON manifests
        working-directory: .
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/.mcp.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/server.json >/dev/null

      - name: Assert safe plugin defaults
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("plugins/xrocket-exchange/.mcp.json").read_text())
          env = config["mcpServers"]["xrocket"]["env"]
          assert env["XROCKET_PROFILE"] == "public"
          assert env["XROCKET_ENVIRONMENT"] == "mainnet"
          assert env["XROCKET_ENABLE_TRADING"] == "false"
          assert env["XROCKET_ENABLE_TRANSFERS"] == "false"
          assert env["XROCKET_ENABLE_WITHDRAWALS"] == "false"
          assert env["XROCKET_ALLOW_MAINNET_WRITES"] == "false"
          PY
