name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/xrocket-exchange
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/xrocket-exchange/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundled server
        run: |
          npm run build
          git diff --exit-code -- dist/cli.js dist/hosted.js
          if grep -Eq 'xrocket_(account|orders|transfers|withdrawal|order_|transfer_)' dist/hosted.js; then
            echo "Hosted bundle contains a private or financial tool name" >&2
            exit 1
          fi

      - name: Smoke-test bundled stdio server
        run: npm run smoke:stdio

      - name: Build and smoke-test containers
        working-directory: .
        run: |
          docker build --target stdio --tag xrocket-mcp-stdio:ci .
          docker build --tag xrocket-mcp-http:ci .
          cd plugins/xrocket-exchange
          XROCKET_SMOKE_DOCKER_IMAGE=xrocket-mcp-stdio:ci npm run smoke:stdio
          docker run --rm --entrypoint sh xrocket-mcp-http:ci -c 'test -f /app/dist/hosted.js && test ! -e /app/dist/cli.js'
          docker run --rm -d --name xrocket-mcp-http-ci -p 127.0.0.1:3010:3000 xrocket-mcp-http:ci
          trap 'docker logs xrocket-mcp-http-ci || true; docker stop xrocket-mcp-http-ci >/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            node -e "fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" && break
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 1
          done
          XROCKET_MCP_HTTP_URL=http://127.0.0.1:3010/mcp npm run smoke:http

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Parse JSON manifests
        working-directory: .
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/.mcp.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/plugin.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/mcp.json >/dev/null
          python3 -m json.tool plugins/xrocket-exchange/server.json >/dev/null
          python3 -m json.tool gemini-extension.json >/dev/null

      - name: Assert safe plugin defaults
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("plugins/xrocket-exchange/.mcp.json").read_text())
          env = config["mcpServers"]["xrocket"]["env"]
          assert env["XROCKET_PROFILE"] == "public"
          assert env["XROCKET_ENVIRONMENT"] == "mainnet"
          assert env["XROCKET_ENABLE_TRADING"] == "false"
          assert env["XROCKET_ENABLE_TRANSFERS"] == "false"
          assert env["XROCKET_ENABLE_WITHDRAWALS"] == "false"
          assert env["XROCKET_ALLOW_MAINNET_WRITES"] == "false"
          PY
