name: Release assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/xrocket-exchange/package-lock.json

      - name: Install, test, and build
        working-directory: plugins/xrocket-exchange
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Pack npm artifact
        working-directory: plugins/xrocket-exchange
        run: npm pack --pack-destination ../..

      - name: Pack Codex plugin artifact
        run: |
          cd plugins
          zip -r ../xrocket-exchange-codex-plugin.zip xrocket-exchange \
            -x 'xrocket-exchange/node_modules/*' \
            -x 'xrocket-exchange/src/*' \
            -x 'xrocket-exchange/test/*' \
            -x 'xrocket-exchange/coverage/*' \
            -x 'xrocket-exchange/*.tgz'

      - name: Pack Gemini CLI extension artifacts
        run: |
          tar -czf darwin.xrocket-exchange.tar.gz gemini-extension.json README.md LICENSE
          cp darwin.xrocket-exchange.tar.gz linux.xrocket-exchange.tar.gz
          zip -j win32.xrocket-exchange.zip gemini-extension.json README.md LICENSE
          tar -tzf darwin.xrocket-exchange.tar.gz | grep -Fx gemini-extension.json
          tar -tzf linux.xrocket-exchange.tar.gz | grep -Fx gemini-extension.json
          unzip -p win32.xrocket-exchange.zip gemini-extension.json | python3 -m json.tool >/dev/null

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            xrocket-mcp-*.tgz \
            xrocket-exchange-codex-plugin.zip \
            darwin.xrocket-exchange.tar.gz \
            linux.xrocket-exchange.tar.gz \
            win32.xrocket-exchange.zip \
            --clobber
